<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patna | Business Search and Matching</title>
    <meta name="description" content="Find anything in Tanzania. Ask on WhatsApp, SMS, Web, or App. A service by Patnacom Services, Dar es Salaam." />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://www.patnacom.co.tz/" />
    
    <!-- Open Graph -->
    <meta property="og:site_name" content="Patna" />
    <meta property="og:url" content="https://www.patnacom.co.tz/" />
    <meta property="og:title" content="Patna | Business Search and Matching" />
    <meta property="og:description" content="Find products, buses, hotels, food, and delivery in Tanzania. Just ask in Swahili or English." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="sw_TZ" />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Patna — Tanzania's Multi-Channel Search & Matching Platform" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Patna | Business Search and Matching" />
    <meta name="twitter:description" content="Find anything in Tanzania. Just ask on WhatsApp, SMS, Web, or App." />
    <meta name="twitter:image" content="/og-image.jpg" />
    <meta name="twitter:image:alt" content="Patna — Tanzania's Multi-Channel Search & Matching Platform" />

    <!-- Schema.org JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Patna",
      "url": "https://www.patnacom.co.tz/",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "All",
      "description": "WhatsApp, SMS, Web, and App-based search and matching service for Tanzania, operated by Patnacom Services.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "TZS"
      },
      "provider": {
        "@type": "Organization",
        "name": "Patnacom Services",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Dar es Salaam",
          "addressCountry": "TZ"
        }
      }
    }
    </script>
  </head>
  <body class="bg-[#FBFBFA] dark:bg-[#0C0E0D] text-[#141716] dark:text-[#E8EAE9] antialiased selection:bg-[#2541b2]/20 selection:text-[#2541b2]">
    <div id="root">
      <div role="status" aria-live="polite" class="min-h-screen flex flex-col items-center justify-center px-6 text-center bg-[#FBFBFA] text-[#141716]">
        <div class="text-3xl font-extrabold tracking-tight text-[#2541b2] mb-4">
          Patna<span class="text-[#141716]">.</span>
        </div>
        <div class="w-6 h-6 rounded-full border-2 border-[#2541b2]/25 border-t-[#2541b2] animate-spin mb-3" aria-hidden="true"></div>
        <p class="text-xs font-mono text-[#5B615E]">Loading Patna...</p>
        <p id="patna-boot-slow" class="hidden mt-3 text-xs text-[#717774] max-w-xs leading-relaxed">
          Slow network detected — still loading. You can also use Patna directly via SMS (+255 683 007005).
        </p>
        <noscript>
          <p class="mt-4 text-xs text-[#5B615E] max-w-sm">
            JavaScript is required for the web portal. You can still reach Patna via WhatsApp or SMS on +255 683 007005.
          </p>
        </noscript>
      </div>
    </div>
    <script>
      window.__PATNA_BOOT_TIMER__ = window.setTimeout(function () {
        window.__PATNA_SLOW_BOOT__ = true;
        var el = document.getElementById('patna-boot-slow');
        if (el) el.classList.remove('hidden');
      }, 3000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
